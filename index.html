<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8" id="metaTheme">
<title>Quản lý Thiếu niên Nhi đồng - Bản Sấm</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ============================================================
   BIẾN MÀU — SÁNG / TỐI
   ============================================================ */
:root{
  --bg:#eef2f7;
  --bg-soft:#e2e8f0;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#f1f5f9;
  --border:#e2e8f0;
  --border-soft:#eef2f7;
  --text:#0f172a;
  --text-2:#334155;
  --text-3:#64748b;
  --text-muted:#94a3b8;
  --text-faint:#cbd5e1;

  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --primary-darker:#1e3a8a;
  --primary-soft:#e8f0ff;

  --header-grad:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 55%,#2563eb 100%);
  --header-shadow:rgba(29,78,216,.28);

  --toolbar-bg:rgba(238,242,247,.94);
  --card-shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);

  --tag-khac-bg:#f1f5f9;   --tag-khac-fg:#64748b;
  --tag-mamnon-bg:#ffe4e6; --tag-mamnon-fg:#be123c;
  --tag-tieuhoc-bg:#dcfce7; --tag-tieuhoc-fg:#15803d;
  --tag-thcs-bg:#dbeafe;   --tag-thcs-fg:#1d4ed8;
  --tag-thpt-bg:#fef3c7;   --tag-thpt-fg:#b45309;
  --tag-cls-bg:#f3e8ff;    --tag-cls-fg:#7e22ce;
  --tag-nam-bg:#e0f2fe;    --tag-nam-fg:#0369a1;
  --tag-nu-bg:#fce7f3;     --tag-nu-fg:#be185d;

  --danger-bg:#fee2e2; --danger-fg:#dc2626;
}

html[data-theme="dark"]{
  --bg:#0b1220;
  --bg-soft:#0f172a;
  --surface:#111c2e;
  --surface-2:#152238;
  --surface-3:#1c2b45;
  --border:#243652;
  --border-soft:#1a2a43;
  --text:#e8eefc;
  --text-2:#c3d2ea;
  --text-3:#8ea3c2;
  --text-muted:#6d84a3;
  --text-faint:#41546f;

  --primary:#3b82f6;
  --primary-dark:#2563eb;
  --primary-darker:#1d4ed8;
  --primary-soft:#1b2b4a;

  --header-grad:linear-gradient(135deg,#0a1a3a 0%,#132a56 55%,#1b3a75 100%);
  --header-shadow:rgba(0,0,0,.5);

  --toolbar-bg:rgba(11,18,32,.94);
  --card-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);

  --tag-khac-bg:#1e2a41;   --tag-khac-fg:#94a3b8;
  --tag-mamnon-bg:#4a1f2b; --tag-mamnon-fg:#fda4af;
  --tag-tieuhoc-bg:#173b2a; --tag-tieuhoc-fg:#86efac;
  --tag-thcs-bg:#1b2c52;   --tag-thcs-fg:#93c5fd;
  --tag-thpt-bg:#3f2f0e;   --tag-thpt-fg:#fcd34d;
  --tag-cls-bg:#34204f;    --tag-cls-fg:#d8b4fe;
  --tag-nam-bg:#0c2438;    --tag-nam-fg:#7dd3fc;
  --tag-nu-bg:#3a1526;     --tag-nu-fg:#f9a8d4;

  --danger-bg:#3d1618; --danger-fg:#fca5a5;
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}

/* ============ HEADER ============ */
.app-header{
  background:var(--header-grad);
  color:#fff;padding:16px 16px 0;border-radius:0 0 24px 24px;
  box-shadow:0 8px 24px var(--header-shadow);position:relative;overflow:hidden;
  transition:background .3s,box-shadow .3s;
}
.app-header::after{
  content:'';position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.app-header::before{
  content:'';position:absolute;left:-30px;bottom:-70px;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.emblem{
  width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;font-size:23px;border:1px solid rgba(255,255,255,.3);
  flex:0 0 auto;
}
.brand-text{flex:1;min-width:0}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.25}
.brand p{margin:3px 0 0;font-size:12.5px;opacity:.85}

.theme-toggle{
  flex:0 0 auto;
  width:42px;height:42px;border-radius:13px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
  color:#fff;display:grid;place-items:center;cursor:pointer;
  transition:transform .18s,background .2s;padding:0;position:relative;z-index:1;
}
.theme-toggle:active{transform:scale(.9)}
.theme-toggle svg{width:20px;height:20px;pointer-events:none}
.theme-toggle .sun{display:none}
.theme-toggle .moon{display:block}
html[data-theme="dark"] .theme-toggle .sun{display:block}
html[data-theme="dark"] .theme-toggle .moon{display:none}

.stats{
  display:flex;gap:8px;overflow-x:auto;padding:14px 0 16px;
  scrollbar-width:none;position:relative;z-index:1;
}
.stats::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);
  border-radius:13px;padding:8px 13px;min-width:80px;backdrop-filter:blur(6px);
  transition:background .25s;
}
.stat.highlight{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.45)}
.stat b{display:block;font-size:18px;line-height:1.15;font-weight:700}
.stat span{font-size:11px;opacity:.9;white-space:nowrap}

/* ============ TOOLBAR ============ */
.toolbar{
  position:sticky;top:0;z-index:30;background:var(--toolbar-bg);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:12px 16px 10px;margin-top:-4px;border-bottom:1px solid var(--border);
  transition:background .3s,border-color .3s;
}
.search-wrap{position:relative}
.search-wrap svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--text-muted);pointer-events:none;
}
.search-wrap input{
  width:100%;padding:12px 14px 12px 39px;border-radius:13px;border:1px solid var(--border);
  background:var(--surface);font-size:15px;outline:none;transition:.2s;font-family:inherit;
  color:var(--text);
}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.search-wrap input::placeholder{color:var(--text-muted)}

.filters{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.filters::-webkit-scrollbar{display:none}
select{
  flex:0 0 auto;padding:9px 30px 9px 12px;border-radius:11px;border:1px solid var(--border);
  background-color:var(--surface);font-size:13.5px;color:var(--text);
  appearance:none;-webkit-appearance:none;
  font-family:inherit;outline:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:14px;
  transition:background-color .3s,color .3s,border-color .3s;
}
select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
html[data-theme="dark"] select{
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238ea3c2' stroke-width='2.5' stroke-linecap='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
}

.tools{display:flex;gap:8px;margin-top:8px}
.btn{
  border:none;border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .15s,background .2s;font-family:inherit;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.3)}
.btn.ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn.secondary{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:var(--danger-bg);color:var(--danger-fg)}
.tools .btn{flex:1}

/* ============ LIST ============ */
.list{padding:14px 16px;display:grid;gap:10px;grid-template-columns:1fr;max-width:1400px;margin:0 auto}
@media(min-width:680px){.list{grid-template-columns:1fr 1fr}}
@media(min-width:1080px){.list{grid-template-columns:repeat(3,1fr)}}

.card{
  background:var(--surface);border-radius:16px;padding:12px 14px;
  box-shadow:var(--card-shadow);
  border:1px solid var(--border-soft);animation:fade .25s ease;
  transition:background .3s,border-color .3s,box-shadow .3s;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card-head{display:flex;gap:10px;align-items:flex-start}
.stt{
  flex:0 0 auto;width:27px;height:27px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
  font-size:12.5px;font-weight:700;display:grid;place-items:center;margin-top:1px;
}
.name-wrap{flex:1;min-width:0}
.name{margin:0;font-size:15px;font-weight:700;line-height:1.35;word-break:break-word;color:var(--text)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;line-height:1.5}
.tag.g-khac{background:var(--tag-khac-bg);color:var(--tag-khac-fg)}
.tag.g-mamnon{background:var(--tag-mamnon-bg);color:var(--tag-mamnon-fg)}
.tag.g-tieuhoc{background:var(--tag-tieuhoc-bg);color:var(--tag-tieuhoc-fg)}
.tag.g-thcs{background:var(--tag-thcs-bg);color:var(--tag-thcs-fg)}
.tag.g-thpt{background:var(--tag-thpt-bg);color:var(--tag-thpt-fg)}
.tag.cls{background:var(--tag-cls-bg);color:var(--tag-cls-fg)}
.tag.nam{background:var(--tag-nam-bg);color:var(--tag-nam-fg)}
.tag.nu{background:var(--tag-nu-bg);color:var(--tag-nu-fg)}

.card-actions{display:flex;gap:5px;flex:0 0 auto}
.icon-btn{
  width:32px;height:32px;border-radius:9px;border:none;background:var(--surface-3);color:var(--text-3);
  display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s;padding:0;
}
.icon-btn svg{width:15px;height:15px}
.icon-btn.del{background:var(--danger-bg);color:var(--danger-fg)}
.icon-btn:active{transform:scale(.9)}

.card-body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:grid;gap:6px}
.row{display:flex;gap:8px;font-size:13px;align-items:baseline}
.row .k{color:var(--text-muted);flex:0 0 84px;font-size:12px;font-weight:500}
.row .v{color:var(--text-2);flex:1;word-break:break-word;min-width:0}
.row .v a{color:var(--primary);text-decoration:none;font-weight:600}
.row .v.muted{color:var(--text-faint)}

.empty{text-align:center;padding:70px 24px;color:var(--text-muted);grid-column:1/-1}
.empty svg{width:64px;height:64px;opacity:.35;margin-bottom:14px}
.empty h3{margin:0 0 8px;color:var(--text-3);font-size:16px}
.empty p{margin:0;font-size:13.5px;line-height:1.6}

/* ============ FAB ============ */
.fab{
  position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:20px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 10px 26px rgba(29,78,216,.42);z-index:40;transition:transform .18s;padding:0;
}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.92)}

/* ============ MODAL ============ */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);z-index:100;display:none;
  align-items:flex-end;justify-content:center;
}
html[data-theme="dark"] .overlay{background:rgba(0,0,0,.7)}
.overlay.show{display:flex}
@media(min-width:640px){.overlay{align-items:center}}

.sheet{
  background:var(--surface);width:100%;max-width:540px;max-height:93vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:18px 18px 22px;
  animation:slideUp .3s cubic-bezier(.2,.8,.3,1);
  -webkit-overflow-scrolling:touch;
  transition:background .3s;
}
@media(min-width:640px){.sheet{border-radius:22px}}
@keyframes slideUp{from{transform:translateY(50px);opacity:.4}to{transform:none;opacity:1}}

.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.sheet-head h2{margin:0;font-size:17px;font-weight:700;color:var(--text)}
.close{
  width:34px;height:34px;border-radius:11px;border:none;background:var(--surface-3);color:var(--text-3);
  font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0;
}
.close:active{transform:scale(.92)}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-3);margin-bottom:5px}
.field .req{color:#dc2626}
.field input,.field select{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);
  font-size:15px;background:var(--surface);outline:none;font-family:inherit;color:var(--text);
  transition:border-color .2s,box-shadow .2s,background .3s;
}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.field input[readonly]{background:var(--primary-soft);color:var(--primary);font-weight:700;cursor:default}
.field input::placeholder{color:var(--text-muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sheet-actions{display:flex;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1;padding:14px;font-size:14.5px}

/* ============ DIALOG ============ */
.dialog{
  background:var(--surface);border-radius:20px;padding:22px;width:calc(100% - 40px);max-width:400px;
  animation:pop .25s cubic-bezier(.2,.8,.3,1);margin:auto;
  transition:background .3s;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.dialog h3{margin:0 0 10px;font-size:16.5px;color:var(--text)}
.dialog p{margin:0 0 18px;font-size:13.5px;color:var(--text-3);line-height:1.6}
.dialog-actions{display:flex;flex-direction:column;gap:9px}
.dialog-actions .btn{width:100%;padding:13px}

/* ============ TOAST ============ */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;padding:12px 20px;border-radius:13px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:88vw;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500;
}
html[data-theme="dark"] .toast{background:#e8eefc;color:#0f172a}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="emblem">★</div>
    <div class="brand-text">
      <h1>Quản lý Thiếu niên Nhi đồng</h1>
      <p>Chi đoàn Bản Sấm</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Đổi giao diện">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="search" placeholder="Tìm tên, bố mẹ, SĐT, lớp...">
  </div>

  <div class="filters">
    <select id="fAddress">
      <option value="">Tất cả địa chỉ</option>
      <option>Thôn Sấm 1</option>
      <option>Thôn Sấm 2</option>
      <option>Thôn Sấm 3</option>
      <option>Thôn Bãi Cả</option>
    </select>
    <select id="fGender">
      <option value="">Tất cả giới tính</option>
      <option>Nam</option>
      <option>Nữ</option>
    </select>
    <select id="fGroup">
      <option value="">Tất cả khối</option>
      <option>Khác</option>
      <option>Mầm non</option>
      <option>Tiểu học</option>
      <option>THCS</option>
      <option>THPT</option>
    </select>
  </div>

  <div class="tools">
    <button class="btn ghost" id="btnImport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Nhập Excel
    </button>
    <button class="btn primary" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Xuất Excel
    </button>
  </div>
</div>

<main class="list" id="list"></main>

<button class="fab" id="btnAdd" aria-label="Thêm mới">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>

<!-- FORM MODAL -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <h2 id="formTitle">Thêm mới</h2>
      <button class="close" id="btnClose" type="button">×</button>
    </div>
    <form id="form" autocomplete="off">
      <div class="field">
        <label>Họ và tên <span class="req">*</span></label>
        <input name="name" required placeholder="Nguyễn Văn A">
      </div>

      <div class="grid2">
        <div class="field">
          <label>Ngày sinh</label>
          <input type="date" name="dob" id="dobInput">
        </div>
        <div class="field">
          <label>Giới tính</label>
          <select name="gender">
            <option value="">-- Chọn --</option>
            <option>Nam</option>
            <option>Nữ</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Địa chỉ</label>
        <select name="address">
          <option value="">-- Chọn thôn --</option>
          <option>Thôn Sấm 1</option>
          <option>Thôn Sấm 2</option>
          <option>Thôn Sấm 3</option>
          <option>Thôn Bãi Cả</option>
        </select>
      </div>

      <div class="grid2">
        <div class="field">
          <label>Lớp</label>
          <input name="className" placeholder="VD: 9B">
        </div>
        <div class="field">
          <label>Khối (tự động)</label>
          <input name="group" id="groupField" readonly placeholder="--">
        </div>
      </div>

      <div class="field">
        <label>Họ tên Bố</label>
        <input name="father" placeholder="Nguyễn Văn B">
      </div>

      <div class="field">
        <label>Họ tên Mẹ</label>
        <input name="mother" placeholder="Trần Thị C">
      </div>

      <div class="field">
        <label>SĐT phụ huynh</label>
        <input name="phone" type="tel" inputmode="tel" placeholder="09xxxxxxxx">
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="btnCancel">Hủy</button>
        <button type="submit" class="btn primary">Lưu lại</button>
      </div>
    </form>
  </div>
</div>

<!-- IMPORT DIALOG -->
<div class="overlay" id="importOverlay">
  <div class="dialog">
    <h3>Nhập dữ liệu từ Excel</h3>
    <p id="importInfo"></p>
    <div class="dialog-actions">
      <button class="btn primary" data-mode="replace">Thay thế toàn bộ danh sách</button>
      <button class="btn secondary" data-mode="append">Thêm vào danh sách hiện có</button>
      <button class="btn ghost" data-mode="cancel">Hủy bỏ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   GIAO DIỆN SÁNG / TỐI
   ============================================================ */
const THEME_KEY = 'tnnd_theme';
const metaTheme = document.getElementById('metaTheme');

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  metaTheme.setAttribute('content', theme === 'dark' ? '#0b1220' : '#1d4ed8');
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}

function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(saved === 'dark' || saved === 'light'){
    applyTheme(saved);
  }else{
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

/* ============================================================
   HẰNG SỐ & TIỆN ÍCH
   ============================================================ */
const LS_KEY = 'tnnd_bansam_v1';
const ADDRESSES = ['Thôn Sấm 1','Thôn Sấm 2','Thôn Sấm 3','Thôn Bãi Cả'];
const GROUPS = ['Khác','Mầm non','Tiểu học','THCS','THPT'];

const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
const ICON_DEL  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
const ICON_EMPTY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---------- Tính tuổi ---------- */
function calcAge(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age;
}

/* ---------- Chia khối THEO NĂM SINH — tự lên lớp vào tháng 9 ---------- */
function groupOf(dobIso){
  if(!dobIso) return 'Khác';
  const y = parseInt(String(dobIso).substring(0,4), 10);
  if(isNaN(y)) return 'Khác';

  const now = new Date();
  const schoolYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;

  if(y >= schoolYear - 2)  return 'Khác';
  if(y >= schoolYear - 5)  return 'Mầm non';
  if(y >= schoolYear - 10) return 'Tiểu học';
  if(y >= schoolYear - 14) return 'THCS';
  return 'THPT';
}
function groupClass(g){
  return {
    'Khác':'g-khac',
    'Mầm non':'g-mamnon',
    'Tiểu học':'g-tieuhoc',
    'THCS':'g-thcs',
    'THPT':'g-thpt'
  }[g] || 'g-khac';
}
function genderClass(g){
  if(g === 'Nam') return 'nam';
  if(g === 'Nữ')  return 'nu';
  return 'g-khac';
}

/* ---------- Ngày tháng ---------- */
function fmtDate(iso){
  if(!iso) return '';
  const p = iso.split('-');
  if(p.length !== 3) return iso;
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function toISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function parseDate(v){
  if(v === null || v === undefined || v === '') return null;
  if(v instanceof Date && !isNaN(v.getTime())) return v;
  if(typeof v === 'number'){
    try{ const o = XLSX.SSF.parse_date_code(v); if(o) return new Date(o.y, o.m-1, o.d); }catch(e){}
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2})$/);
  if(m) return new Date(2000 + (+m[3]), +m[2]-1, +m[1]);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

/* ---------- Chuẩn hóa ---------- */
function normalizeAddress(a){
  const s = String(a||'').toLowerCase().trim();
  if(!s) return '';
  if(/sấm\s*1|sam\s*1/.test(s)) return 'Thôn Sấm 1';
  if(/sấm\s*2|sam\s*2/.test(s)) return 'Thôn Sấm 2';
  if(/sấm\s*3|sam\s*3/.test(s)) return 'Thôn Sấm 3';
  if(/bãi\s*cả|bai\s*ca/.test(s)) return 'Thôn Bãi Cả';
  return String(a).trim();
}
function normGender(v){
  const s = String(v||'').toLowerCase().trim();
  if(s.includes('nữ')) return 'Nữ';
  if(s.includes('nam')) return 'Nam';
  return '';
}

/* ============================================================
   STATE
   ============================================================ */
let data = [];
let editingId = null;
let pendingImport = null;

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    data = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(data)) data = [];
  }catch(e){ data = []; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch(e){ toast('Không lưu được dữ liệu (bộ nhớ đầy)'); }
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ============================================================
   THỐNG KÊ — PHẢN ÁNH THEO BỘ LỌC ĐANG CHỌN
   ============================================================ */
function renderStats(){
  const fa  = document.getElementById('fAddress').value;
  const fge = document.getElementById('fGender').value;
  const fg  = document.getElementById('fGroup').value;

  let filtered = data;
  if(fa)  filtered = filtered.filter(it => (it.address||'') === fa);
  if(fge) filtered = filtered.filter(it => (it.gender||'') === fge);
  if(fg)  filtered = filtered.filter(it => groupOf(it.dob) === fg);

  const counts = { 'Khác':0, 'Mầm non':0, 'Tiểu học':0, 'THCS':0, 'THPT':0 };
  filtered.forEach(it => {
    const g = groupOf(it.dob);
    if(counts[g] !== undefined) counts[g]++;
  });

  let totalLabel = 'Tổng';
  const parts = [];
  if(fa)  parts.push(fa);
  if(fge) parts.push(fge);
  if(fg)  parts.push(fg);
  if(parts.length) totalLabel = parts.join(' · ');

  const chips = [[totalLabel, filtered.length, true]];
  GROUPS.forEach(g => {
    if(counts[g] > 0) chips.push([g, counts[g], false]);
  });

  document.getElementById('stats').innerHTML = chips
    .map(([label, n, isTotal]) =>
      `<div class="stat${isTotal?' highlight':''}"><b>${n}</b><span>${label}</span></div>`
    )
    .join('');
}

/* ============================================================
   LỌC + SẮP XẾP (cố định: tuổi giảm dần)
   ============================================================ */
function getView(){
  const q   = document.getElementById('search').value.trim().toLowerCase();
  const fa  = document.getElementById('fAddress').value;
  const fge = document.getElementById('fGender').value;
  const fg  = document.getElementById('fGroup').value;

  let list = data.map((it, i) => ({ ...it, _i: i }));

  if(q){
    list = list.filter(it =>
      (it.name||'').toLowerCase().includes(q) ||
      (it.father||'').toLowerCase().includes(q) ||
      (it.mother||'').toLowerCase().includes(q) ||
      (it.phone||'').toLowerCase().includes(q) ||
      (it.className||'').toLowerCase().includes(q) ||
      (it.address||'').toLowerCase().includes(q)
    );
  }
  if(fa)  list = list.filter(it => (it.address||'') === fa);
  if(fge) list = list.filter(it => (it.gender||'') === fge);
  if(fg)  list = list.filter(it => groupOf(it.dob) === fg);

  // Luôn sắp xếp theo tuổi giảm dần (người lớn tuổi lên trước)
  list.sort((a,b) => {
    const A = calcAge(a.dob), B = calcAge(b.dob);
    return (B === null ? -1 : B) - (A === null ? -1 : A);
  });
  return list;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  renderStats();
  const list = getView();
  const box = document.getElementById('list');

  if(!list.length){
    box.innerHTML = `<div class="empty">${ICON_EMPTY}
      <h3>${data.length ? 'Không tìm thấy kết quả' : 'Chưa có dữ liệu'}</h3>
      <p>${data.length
        ? 'Thử đổi từ khóa hoặc bộ lọc khác nhé.'
        : 'Nhấn <b>Nhập Excel</b> để tải danh sách từ file,<br>hoặc nhấn nút <b>+</b> để thêm mới.'}</p>
    </div>`;
    return;
  }

  box.innerHTML = list.map((it, idx) => {
    const age = calcAge(it.dob);
    const grp = groupOf(it.dob);
    const ageTxt = age === null ? '' : ` · ${age} tuổi`;
    const phoneHtml = it.phone
      ? `<a href="tel:${it.phone}">${it.phone}</a>`
      : `<span style="color:var(--text-faint)">Chưa có</span>`;

    return `
    <div class="card" data-id="${it.id}">
      <div class="card-head">
        <div class="stt">${idx+1}</div>
        <div class="name-wrap">
          <h3 class="name">${esc(it.name)}</h3>
          <div class="tags">
            <span class="tag ${groupClass(grp)}">${grp}</span>
            ${it.className ? `<span class="tag cls">Lớp ${esc(it.className)}</span>` : ''}
            ${it.gender ? `<span class="tag ${genderClass(it.gender)}">${esc(it.gender)}</span>` : ''}
          </div>
        </div>
        <div class="card-actions">
          <button class="icon-btn" data-act="edit" title="Sửa">${ICON_EDIT}</button>
          <button class="icon-btn del" data-act="del" title="Xóa">${ICON_DEL}</button>
        </div>
      </div>
      <div class="card-body">
        <div class="row"><span class="k">Ngày sinh</span><span class="v ${it.dob?'':'muted'}">${it.dob ? esc(fmtDate(it.dob)) + ageTxt : 'Chưa có'}</span></div>
        <div class="row"><span class="k">Địa chỉ</span><span class="v ${it.address?'':'muted'}">${it.address ? esc(it.address) : 'Chưa có'}</span></div>
        <div class="row"><span class="k">Bố</span><span class="v ${it.father?'':'muted'}">${it.father ? esc(it.father) : 'Chưa có'}</span></div>
        <div class="row"><span class="k">Mẹ</span><span class="v ${it.mother?'':'muted'}">${it.mother ? esc(it.mother) : 'Chưa có'}</span></div>
        <div class="row"><span class="k">SĐT PH</span><span class="v">${phoneHtml}</span></div>
      </div>
    </div>`;
  }).join('');
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============================================================
   FORM
   ============================================================ */
const overlay = document.getElementById('overlay');
const form = document.getElementById('form');
const dobInput = document.getElementById('dobInput');
const groupField = document.getElementById('groupField');

function updateGroupField(){
  groupField.value = groupOf(dobInput.value);
}
dobInput.addEventListener('change', updateGroupField);
dobInput.addEventListener('input', updateGroupField);

function openForm(id){
  editingId = id || null;
  form.reset();
  document.getElementById('formTitle').textContent = id ? 'Chỉnh sửa thông tin' : 'Thêm mới thiếu niên nhi đồng';

  if(id){
    const it = data.find(x => x.id === id);
    if(!it) return;
    form.name.value = it.name || '';
    form.dob.value = it.dob || '';
    form.gender.value = it.gender || '';
    form.address.value = it.address || '';
    form.className.value = it.className || '';
    form.father.value = it.father || '';
    form.mother.value = it.mother || '';
    form.phone.value = it.phone || '';
  }
  updateGroupField();
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(() => { if(!id) form.name.focus(); }, 250);
}

function closeForm(){
  overlay.classList.remove('show');
  document.body.style.overflow = '';
  editingId = null;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const obj = {
    name: form.name.value.trim(),
    dob: form.dob.value || '',
    gender: form.gender.value || '',
    address: form.address.value || '',
    className: form.className.value.trim(),
    father: form.father.value.trim(),
    mother: form.mother.value.trim(),
    phone: form.phone.value.trim()
  };
  if(!obj.name){ toast('Vui lòng nhập họ và tên'); return; }

  if(editingId){
    const i = data.findIndex(x => x.id === editingId);
    if(i > -1) data[i] = { ...data[i], ...obj };
    toast('Đã cập nhật thông tin');
  }else{
    data.push({ id: uid(), ...obj });
    toast('Đã thêm mới thành công');
  }
  save(); render(); closeForm();
});

document.getElementById('btnClose').onclick = closeForm;
document.getElementById('btnCancel').onclick = closeForm;
document.getElementById('btnAdd').onclick = () => openForm(null);
overlay.addEventListener('click', e => { if(e.target === overlay) closeForm(); });

/* ============================================================
   SỰ KIỆN DANH SÁCH
   ============================================================ */
document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const id = btn.closest('.card').dataset.id;
  if(btn.dataset.act === 'edit'){
    openForm(id);
  }else if(btn.dataset.act === 'del'){
    const it = data.find(x => x.id === id);
    if(!it) return;
    if(confirm(`Xóa "${it.name}" khỏi danh sách?`)){
      data = data.filter(x => x.id !== id);
      save(); render();
      toast('Đã xóa');
    }
  }
});

/* ============================================================
   BỘ LỌC
   ============================================================ */
['search','fAddress','fGender','fGroup'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(id === 'search' ? 'input' : 'change', render);
});

/* ============================================================
   XUẤT EXCEL
   ============================================================ */
document.getElementById('btnExport').onclick = () => {
  const list = getView();
  if(!list.length){ toast('Không có dữ liệu để xuất'); return; }

  const aoa = [[
    'STT','Họ và tên','Ngày sinh','Giới tính','Địa chỉ','Lớp','Khối','Tuổi',
    'Họ tên Bố','Họ tên Mẹ','SĐT PH'
  ]];

  list.forEach((it, i) => {
    const age = calcAge(it.dob);
    aoa.push([
      i + 1,
      it.name || '',
      it.dob ? fmtDate(it.dob) : '',
      it.gender || '',
      it.address || '',
      it.className || '',
      groupOf(it.dob),
      age === null ? '' : age,
      it.father || '',
      it.mother || '',
      it.phone || ''
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [
    {wch:5},{wch:24},{wch:12},{wch:9},{wch:15},{wch:8},{wch:11},{wch:7},
    {wch:22},{wch:22},{wch:14}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'DS_TNND_BANSAM');

  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `DS_TNND_BanSam_${stamp}.xlsx`);
  toast(`Đã xuất ${list.length} dòng ra Excel`);
};

/* ============================================================
   NHẬP EXCEL
   ============================================================ */
const fileInput = document.getElementById('fileInput');
const importOverlay = document.getElementById('importOverlay');

document.getElementById('btnImport').onclick = () => fileInput.click();

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array', cellDates:true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
      const items = parseRows(rows);

      if(!items.length){
        toast('Không tìm thấy dữ liệu hợp lệ trong file');
        fileInput.value = '';
        return;
      }
      pendingImport = items;
      document.getElementById('importInfo').innerHTML =
        `Tìm thấy <b>${items.length}</b> thiếu niên nhi đồng trong file <b>${esc(file.name)}</b>.<br><br>Bạn muốn nhập như thế nào?`;
      importOverlay.classList.add('show');
    }catch(err){
      console.error(err);
      toast('Lỗi đọc file: ' + err.message);
    }
    fileInput.value = '';
  };
  reader.readAsArrayBuffer(file);
});

function parseRows(rows){
  let headIdx = -1;
  for(let i = 0; i < Math.min(rows.length, 25); i++){
    const r = rows[i] || [];
    if(r.some(c => /họ\s*(và\s*)?tên/i.test(String(c)))){ headIdx = i; break; }
  }
  if(headIdx < 0) return [];

  const map = {};
  (rows[headIdx] || []).forEach((c, i) => {
    const h = String(c).trim().toLowerCase().replace(/\s+/g,' ');
    if(!h) return;
    if(map.name == null && /họ và tên|họ tên|^tên$/.test(h) && !/bố|mẹ|cha/.test(h)) map.name = i;
    if(map.father == null && /(họ tên|tên)?\s*(bố|ba|cha)/.test(h)) map.father = i;
    if(map.mother == null && /(họ tên|tên)?\s*(mẹ|má)/.test(h)) map.mother = i;
    if(map.dob == null && /ngày sinh|năm sinh/.test(h)) map.dob = i;
    if(map.gender == null && /giới tính/.test(h)) map.gender = i;
    if(map.address == null && /địa chỉ|thôn/.test(h)) map.address = i;
    if(map.className == null && /^lớp| lớp/.test(h)) map.className = i;
    if(map.phone == null && /sđt|số điện thoại|điện thoại|phụ huynh/.test(h)) map.phone = i;
  });
  if(map.name == null) map.name = 1;

  const out = [];
  for(let i = headIdx + 1; i < rows.length; i++){
    const r = rows[i] || [];
    const name = String(r[map.name] == null ? '' : r[map.name]).trim();
    if(!name) continue;
    if(/^(tổng|cộng|ghi chú)/i.test(name)) continue;

    const dobDate = map.dob != null ? parseDate(r[map.dob]) : null;

    out.push({
      id: uid(),
      name,
      dob: dobDate ? toISO(dobDate) : '',
      gender: map.gender != null ? normGender(r[map.gender]) : '',
      address: map.address != null ? normalizeAddress(r[map.address]) : '',
      className: map.className != null ? String(r[map.className] || '').trim() : '',
      father: map.father != null ? String(r[map.father] || '').trim() : '',
      mother: map.mother != null ? String(r[map.mother] || '').trim() : '',
      phone: map.phone != null ? String(r[map.phone] || '').trim() : ''
    });
  }
  return out;
}

importOverlay.addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if(!btn){
    if(e.target === importOverlay) { importOverlay.classList.remove('show'); pendingImport = null; }
    return;
  }
  const mode = btn.dataset.mode;
  if(mode === 'cancel'){
    pendingImport = null;
  }else if(mode === 'replace'){
    data = pendingImport || [];
    save(); render();
    toast(`Đã thay thế danh sách bằng ${data.length} bản ghi`);
    pendingImport = null;
  }else if(mode === 'append'){
    const n = (pendingImport || []).length;
    data = data.concat(pendingImport || []);
    save(); render();
    toast(`Đã thêm ${n} bản ghi vào danh sách`);
    pendingImport = null;
  }
  importOverlay.classList.remove('show');
});

/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */
initTheme();
load();
render();
</script>
</body>
